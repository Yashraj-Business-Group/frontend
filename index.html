    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Yashraj Business Group",
      "url": "https://yashrajbusinessgroup.com/",
      "logo": "https://yashrajbusinessgroup.com/Logo2.jpg",
      "address": {
        "@type": "PostalAddress",

        "postalCode": "411105",
        "addressCountry": "IN"
      },
      "contactPoint": {

        "contactType": "customer service",

      }
    }

  </head>
  <body style="margin: 0; background-color: #001736;">
    <div id="root">
      <div id="ybg-initial-loader" style="position: fixed; inset: 0; background: #001736; z-index: 999999; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: 'Manrope', -apple-system, sans-serif; color: #ffffff;">
        <style>
          @keyframes ybgPulse { 0%, 100% { transform: scale(1); opacity: 0.92; } 50% { transform: scale(1.04); opacity: 1; } }
          @keyframes ybgShimmer { 0% { transform: translateX(-100%); } 100% { transform: translateX(200%); } }
        </style>
        <div style="position: relative; width: 92px; height: 92px; border-radius: 20px; background: #ffffff; padding: 10px; box-shadow: 0 0 35px rgba(0, 36, 81, 0.8); display: flex; align-items: center; justify-content: center; animation: ybgPulse 1.8s ease-in-out infinite;">
          <img src="/Logo2.jpg" alt="Yashraj Business Group" style="width: 100%; height: 100%; object-fit: contain;" />
        </div>
        <div style="margin-top: 22px; font-size: 17px; font-weight: 900; letter-spacing: 0.22em; text-transform: uppercase; color: #ffffff; text-align: center;">
          YASHRAJ BUSINESS GROUP
        </div>
        <div style="margin-top: 6px; font-size: 11px; font-weight: 700; letter-spacing: 0.2em; text-transform: uppercase; color: #fbbf24; text-align: center;">
          Security • Facility • Manpower
        </div>
        <div style="width: 240px; height: 4px; background: rgba(255, 255, 255, 0.12); border-radius: 99px; margin-top: 26px; overflow: hidden; position: relative;">
          <div style="position: absolute; inset: 0; width: 40%; background: linear-gradient(90deg, #f59e0b, #60a5fa, #f59e0b); border-radius: 99px; animation: ybgShimmer 1.3s ease-in-out infinite;"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
